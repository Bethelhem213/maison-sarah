<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maison Sarah - Order</title>
  </head>
  <body>
    <header>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="menu.html">Menu</a></li>
          <li><a href="order.html">Order</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <h1>Place Your Order</h1>
      <p>Please fill out the form below to place your order. We will prepare your items fresh and have them ready for you!</p>
      <form action="#" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required />
        
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required />
        
        <label for="item">Select Item:</label>
        <select id="item" name="item" required>
          <option value="bread">Fresh Bread</option>
          <option value="pastry">Pastry</option>
          <option value="cake">Cake</option>
        </select>
        
        <label for="quantity">Quantity:</label>
        <input type="number" id="quantity" name="quantity" min="1" required />
        
        <button type="submit">Submit Order</button>
      </form>
    </main>
    <footer>
      <p>&copy; 2023 Maison Sarah. All rights reserved.</p>
    </footer>
  </body>
</html>
